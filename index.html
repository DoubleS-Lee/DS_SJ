<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>귀멸의 칼날 사주 매칭</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
</head>
<body>
    <div class="background-overlay"></div>
    <div class="app-container">
        <header class="main-header">
            <h1>귀멸의 사주</h1>
            <p>내 운명과 연결된 호흡은?</p>
        </header>

        <section id="input-section" class="glass-panel">
            <form id="saju-form">
                <div class="form-group">
                    <label>이름 (닉네임)</label>
                    <input type="text" id="username" placeholder="홍길동" required>
                </div>
                <div class="form-group-row">
                    <div class="form-group">
                        <label>생년월일</label>
                        <input type="date" id="birthdate" required>
                    </div>
                    <div class="form-group">
                        <label>달력</label>
                        <select id="calendar-type">
                            <option value="solar">양력</option>
                            <option value="lunar">음력</option>
                        </select>
                    </div>
                </div>
                <div class="form-group-row">
                    <div class="form-group">
                        <label>태어난 시간</label>
                        <input type="time" id="birthtime" required>
                    </div>
                    <div class="form-group">
                        <label>성별</label>
                        <select id="gender">
                            <option value="male">남성</option>
                            <option value="female">여성</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-primary">호흡 분석 시작</button>
            </form>
        </section>

        <section id="loading-section" class="hidden">
            <div class="loader-content">
                <div class="breathing-circle"></div>
                <p>전집중 호흡으로 분석 중...</p>
            </div>
        </section>

        <section id="result-section" class="hidden">
            <div id="capture-area">
                <div id="photocard-container">
                    <div id="photocard" class="card-frame">
                        <div class="character-image-wrapper">
                            <img id="character-img" src="" alt="Character">
                            <div class="image-overlay"></div>
                        </div>
                        <div class="card-top">
                            <h3 id="card-name" class="card-name"></h3>
                        </div>
                        <div class="card-bottom">
                            <div class="card-footer">
                                <span id="user-info-display" class="footer-left"></span>
                            </div>
                            <h2 id="card-title" class="card-title"></h2>
                        </div>
                        <div class="effect-layer"></div>
                        <span class="photocard-watermark">by 월덕요정</span>
                    </div>
                </div>
                <div id="additional-info" class="additional-info">
                    <div class="saju-desc-box">
                        <h3>나의 사주 해석</h3>
                        <p id="card-desc"></p>
                        <span class="box-watermark">by 월덕요정</span>
                    </div>
                    <div class="chemistry-box">
                        <div class="chem-item good">
                            <span class="label">Good 궁합</span>
                            <span id="chem-good" class="val"></span>
                            <span class="box-watermark">by 월덕요정</span>
                        </div>
                        <div class="chem-item bad">
                            <span class="label">Bad 궁합</span>
                            <span id="chem-bad" class="val"></span>
                            <span class="box-watermark">by 월덕요정</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="action-buttons">
                <div class="download-label" style="text-align: center; font-size: 1.3rem; font-weight: bold; color: var(--text-sub); margin-top: 10px; margin-bottom: 5px;">⬇ 다운로드 버튼 ⬇</div>
                <div class="download-row">
                    <button id="btn-download-card" class="btn-secondary">캐릭터<br>카드</button>
                    <button id="btn-download-desc" class="btn-secondary">사주<br>해석</button>
                    <button id="btn-download-good" class="btn-secondary">Good<br>궁합</button>
                    <button id="btn-download-bad" class="btn-secondary">Bad<br>궁합</button>
                </div>
                <div class="share-section">
                    <div class="share-label" style="text-align: center; font-size: 1.3rem; font-weight: bold; color: var(--text-sub); margin-top: 20px; margin-bottom: 15px;">⬇ 친구에게 공유하기 ⬇</div>
                    <div class="share-buttons">
                        <button id="btn-share-link" class="btn-share-icon link-icon" title="링크 복사">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                        </button>
                        <button id="btn-share-kakao" class="btn-share-icon kakao-icon" title="카카오톡 공유">
                            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" width="24" height="24"><path d="M16 4.64C8.268 4.64 2 9.47 2 15.424c0 3.902 2.597 7.306 6.55 9.274l-1.353 4.954c-.167.61.472.99 1.004.606l5.857-3.904h1.942c7.732 0 14-4.83 14-10.784S23.732 4.64 16 4.64z" fill="#3c1e1e"/></svg>
                        </button>
                        <button id="btn-share-fb" class="btn-share-icon fb-icon" title="페이스북 공유">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                        </button>
                        <button id="btn-share-x" class="btn-share-icon x-icon" title="X 공유">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                        </button>
                    </div>
                </div>
                <button id="btn-retry" class="btn-text">↺ 다시하기</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
