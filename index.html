<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="캐릭터 사주 매칭" />
    <meta property="og:description" content="나의 영혼이 속한 세계와 캐릭터를 사주로 알아보세요!" />
    <!-- 이곳에 실제 사이트 도메인이 포함된 이미지 절대 경로를 넣으시오 (예: https://내도메인.com/images/bg_kimetsu.jpg) -->
    <meta property="og:image" content="https://raw.githubusercontent.com/사용자아이디/레포지토리/main/images/bg_kimetsu.jpg" />
    <meta property="og:type" content="website" />
    <title>캐릭터 사주 매칭</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            z-index: 10;
            position: relative;
        }

        .landing-title {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 3rem;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .landing-subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 40px;
        }

        .theme-cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }

        .theme-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            width: 280px;
            text-decoration: none;
            color: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .theme-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .theme-kimetsu:hover {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('./images/bg_kimetsu.jpg');
        }

        .theme-shingeki:hover {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('./images/bg_shingeki.jpg');
        }

        .theme-onepiece:hover {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('./images/bg_onepiece.jpg');
        }

        .theme-card h2 {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 2rem;
            margin: 15px 0 10px;
            color: inherit;
        }

        .theme-card p {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.8);
            line-height: 1.4;
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .theme-kimetsu {
            border-bottom: 4px solid #ff4b2b;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('./images/bg_kimetsu.jpg');
            background-size: cover;
            background-position: center;
        }

        .theme-shingeki {
            border-bottom: 4px solid #4A5D4E;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('./images/bg_shingeki.jpg');
            background-size: cover;
            background-position: center;
        }

        .theme-onepiece {
            border-bottom: 4px solid #1e3c72;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('./images/bg_onepiece.jpg');
            background-size: cover;
            background-position: center;
        }
        
        .landing-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="landing-bg"></div>
    <div class="landing-container">
        <h1 class="landing-title">사주 분석 캐릭터 매칭</h1>
        <p class="landing-subtitle">당신의 영혼이 속한 세계를 선택하세요</p>

        <div class="theme-cards">
            <a href="saju.html?theme=kimetsu" class="theme-card theme-kimetsu">
                <h2>귀멸의 칼날</h2>
                <p>나와 가장 닮은 호흡을 가진 캐릭터는 누구일까?</p>
            </a>

            <a href="saju.html?theme=shingeki" class="theme-card theme-shingeki">
                <h2>진격의 거인</h2>
                <p>벽 밖의 세계, 내 운명을 함께할 캐릭터는?</p>
            </a>

            <a href="saju.html?theme=onepiece" class="theme-card theme-onepiece">
                <h2>원피스</h2>
                <p>위대한 항로, 나의 패기를 깨워줄 해적은?</p>
            </a>
        </div>
    </div>
</body>
</html>
